slug: sacada
titulo: Sacada
nav_group: Sistemas de sacada
ordem: 1
lede: Sistema de envidraçamento de sacadas desenvolvido a partir da NBR 16259/2014 — a norma definiu o produto, não o contrário. Eleito por dois anos consecutivos o melhor sistema do Sul do Brasil, une segurança, praticidade de manuseio e vedação superior em um sistema híbrido testado e homologado.
badges:
- NBR 16259/2014
- 5 anos de garantia
- Instituto Falcão Bauer
- Melhor sistema do Sul — 2022
blocks:
- id: tipologia
  tipo: diff_grid
  titulo: Tipologia e diferenciais
  status: ready
  status_label: conteúdo consolidado
  itens:
  - titulo: Norma primeiro, produto depois
    texto: Desenvolvido a partir dos critérios técnicos da NBR 16259/2014, e não adaptado a ela a posteriori — garante conformidade e segurança absoluta desde a concepção.
  - titulo: Travamento múltiplo
    texto: Elimina a sensação de queda do vidro por meio de travamentos que impedem o desencaixe e garantem estabilidade da folha.
  - titulo: Vedação em 4 barreiras + dreno
    texto: Mecanismo exclusivo de vedação contra chuva e vento, com quatro barreiras superiores e sistema de dreno interno próprio.
  - titulo: Acabamento anti-corte
    texto: Perfis internos cortados a 90°, sem alumínio exposto ou cortante — reduz risco de acidente na instalação e no uso.
  - titulo: Leveza de manuseio
    texto: Projetado para ser operado com facilidade mesmo por idosos, crianças ou pessoas de baixa estatura.
  - titulo: Ferragens 100% inox
    texto: Perfis superiores robustos e inferiores leves; trilho slim de 38mm de altura — mais área de vidro, menos alumínio aparente.
