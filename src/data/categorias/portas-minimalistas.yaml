slug: portas-minimalistas
titulo: Portas minimalistas
nav_group: Portas de grandes vãos
ordem: 2
lede: Sistema desenvolvido para suprir a lacuna do mercado em portas de grandes dimensões — onde modelos tradicionais exigem múltiplos trilhos e nunca abrem o vão por completo. Trabalha em um único trilho, com folhas de até 4 metros de altura e perfil minimalista que funciona como o próprio puxador.
badges:
- Trilho único
- Até 3500mm de altura
- Abertura híbrida multidirecional
blocks:
- id: tipologia
  tipo: diff_grid
  titulo: Tipologia e diferenciais
  status: ready
  status_label: conteúdo consolidado
  itens:
  - titulo: Perfil como puxador
    texto: O próprio perfil funciona como puxador, dispensando ferragem adicional e evitando marcas de dedo no vidro.
  - titulo: Trilho único
    texto: Opera em um único trilho, unindo design minimalista, alta estanqueidade e robustez comprovada em vãos largos.
  - titulo: Abertura em qualquer direção
    texto: O usuário decide o lado de abertura — inclusive com aberturas intercaladas — sem restrição de layout.
  - titulo: Trilho inferior de polímero
    texto: Apenas 23mm de altura, alta resistência, embutido ou sobreposto — suporta inclusive passagem de carro por cima.
  - titulo: Aplicação versátil
    texto: Além de portas de grande vão, pode ser aplicado em janelas e varandas.
  - titulo: Prolongador de correção
    texto: Corrige desnível de viga em até 40mm na parte superior da instalação.
