kicker: "Linha transversal — Neoklon / Blindex"
titulo: "Linha de Selantes"
lede: "Linha de adesivos e selantes de uso geral, complementar a todos os sistemas de envidraçamento — indicada para colagem, vedação e fixação em obra."
produtos:
  - nome: "High Tack Sacadas"
    tag: "novo"
    texto: "Adesivo monocomponente à base de polímero híbrido com silanos modificados, colagem extra forte até 350kg após a cura, em qualquer condição climática — inclusive superfícies úmidas."
    pack: "Cartucho de 400g"
  - nome: "PU Uso Geral"
    texto: "Selante para juntas não sujeitas a grandes movimentações — vedações entre chapas, calhas, rufos, vidro e cerâmica. Uso interno e externo, forma borracha flexível."
    pack: "Cartucho de 400g · branco, cinza e preto"
  - nome: "Silicone Acético"
    texto: "Adesivo incolor pronto para uso — alumínio, vidro, cerâmica, metal, louças, porcelana, madeira e plástico. Contém fungicida na fórmula."
    pack: "Cartucho de 260g · incolor, branco, cinza, preto"
  - nome: "Silicone Neutro — Alta Performance"
    texto: "Cura alcóxi, super resistente às intempéries. Ideal para ACM, selagem de vidros, juntas de dilatação e movimentação em fachadas."
    pack: "Cartucho de 400g · branco, cinza e preto"
  - nome: "Silicone Neutro"
    texto: "Indicado para mármores, granitos, aquários, alumínio, espelhos, janelas, calhas, metais, madeiras e concretos. Resistente a intempéries, permanece flexível."
    pack: "Cartucho de 260g · incolor, branco, cinza, preto"
  - nome: "Fixa Espelho"
    texto: "Monocomponente à base de polímeros híbridos, não escorre. Indicado para espelhos em móveis de madeira, metal e plásticos ABS/PVC — inclusive áreas úmidas. Permite ajuste até 10 min após aplicação."
    pack: "Cartucho de 400g"
  - nome: "Fixador Multiuso"
    texto: "Polímeros híbridos, indicado para mármores, granitos, aquários, alumínio, espelhos, janelas, calhas, metais, madeiras e concretos."
    pack: "Cartucho de 260g"
