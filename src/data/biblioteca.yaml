intro: "Fonte única de verdade para todos os códigos de perfil (SS-XXX / FE-XXXX) usados nos sistemas do catálogo. Perfis compartilhados entre categorias — como SS-014 a SS-017 e SS-024, usados simultaneamente em portas robustas e pele de vidro — têm ficha única aqui, referenciada a partir de cada produto para evitar duplicação e divergência de dados."
